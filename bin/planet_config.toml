# M1DIS Planet Configuration File
# This file can be passed to m1dis_planet.jl using the --config option.
# Example: julia bin/m1dis_planet.jl --config planet_config.toml
# Any command-line arguments explicitly passed will override the settings here.

# ==============================================================================
# Model Output Parameters 
# ==============================================================================

# Name of the model to save (will be generated if empty)
model_name = ""

# Output directory for the saved models (defaults to M1DIS.jl/models/)
out_dir = "models"

# ==============================================================================
# Planetary & Host Star Parameters
# ==============================================================================

# Internal temperature of the planet [K]
t_int = 1200.0

# Semi-major axis of the planet's orbit [AU]
a_au = 0.047

# Planetary Radius in Jupiter Radii [R_Jup]
r_pl = 1.4

# Planetary Mass in Jupiter Masses [M_Jup]
m_pl = 0.69

# Host Star Effective Temperature [K]
t_star = 6065.0

# Transit Depth [%] 
# (Note: this is superseded by r_star if r_star is provided and > 0)
td = 1.5

# Host Star Radius [R_sun] 
# (optional, overrides transit depth calculations if > 0.0)
# r_star = 1.0

# Mixing length parameter
alpha_MLT = 1.5

# Parameter for turbulent pressure. 0.0 turns off turbulent pressure.
pbeta = 1.0

# File with irradiation flux as a function of wavelength (in Å). 
# Format: first column wavelength, second column flux.
# Will be interpolated to the internal grid of the opacity table.
# F_irradiation = ""

# ==============================================================================
# Chemical composition
# ==============================================================================

# metallicity
feh = 0.0

# abundance of each element. All elements missing are set to the default values
# which are specified in the abund file (see eos config toml file).
# specify [X/Fe] composition here as e.g. "C_0.3O,O_0.2,Si_-0.3"
composition = ""

# abundance of alpha elements
alpha = 0.0

# Microturbulence velocity (for opacities only) [km/s]
vmic = 0.0

# config file for other opacity table related parameters
eos_config = "eos_config.toml"

# ==============================================================================
# EoS & Opacity Treatment
# ==============================================================================

# Path to the directory containing the Equation of State and Opacity table files. 
# Leave blank if you want to compute the EoS dynamically
eos_dir = ""

# Signal that the opacity table uses binned opacities (only if eos_dir!="")
binned = false

# Ignore source function from the opacity table and recompute it on-the-fly
mini = false

# Use multi-threading for the Radiative Transfer (RT)
use_threads = true

# include scattering opacity separately from true absorption opacity
scattering = true

# ==============================================================================
# Optical depth grid
# ==============================================================================

# Minimum optical depth to compute
tau_min = -7.0

# Maximum optical depth to compute
tau_max = 2.0

# Number of optical depth points
n_tau = 300

# ==============================================================================
# Solver Parameters (Optional)
# ==============================================================================

# Maximum number of iterations for the solver
maxiter = 200

# Damping parameter for the temperature updates
damping = 0.01
